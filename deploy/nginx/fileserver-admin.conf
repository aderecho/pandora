# Nginx server block for the FileServer admin SPA (static build output).
# Install at /etc/nginx/sites-available/fileserver-admin and symlink into
# sites-enabled. See docs/DEPLOYMENT.md for full context.

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    root /var/www/fileserver/admin/dist;
    index index.html;

    access_log /var/log/nginx/fileserver-admin.access.log;
    error_log  /var/log/nginx/fileserver-admin.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}
