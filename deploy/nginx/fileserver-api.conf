# Nginx server block for the FileServer Laravel API.
# Install at /etc/nginx/sites-available/fileserver-api and symlink into
# sites-enabled. See docs/DEPLOYMENT.md for full context.

server {
    listen 443 ssl http2;
    server_name files.example.com;

    ssl_certificate     /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;

    root /var/www/fileserver/api/public;
    index index.php;

    # Match php.ini's upload_max_filesize / post_max_size.
    client_max_body_size 5120M;

    access_log /var/log/nginx/fileserver-api.access.log;
    error_log  /var/log/nginx/fileserver-api.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fileserver.sock;
        fastcgi_read_timeout 300;
        fastcgi_param PHP_VALUE "upload_max_filesize=5120M \n post_max_size=5120M";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name files.example.com;
    return 301 https://$host$request_uri;
}
