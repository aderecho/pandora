; PHP-FPM pool for the FileServer API.
; Install at /etc/php/8.4/fpm/pool.d/fileserver.conf, then:
;   sudo systemctl restart php8.4-fpm
; See docs/DEPLOYMENT.md for full context.

[fileserver]
user = www-data
group = www-data
listen = /run/php/php-fileserver.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Must be >= the largest bucket max_file_size_bytes you configure, or
; PHP rejects the upload before Laravel ever sees it.
php_admin_value[upload_max_filesize] = 5120M
php_admin_value[post_max_size] = 5120M
php_admin_value[max_execution_time] = 300
php_admin_value[memory_limit] = 512M

php_admin_value[error_log] = /var/www/fileserver/api/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
