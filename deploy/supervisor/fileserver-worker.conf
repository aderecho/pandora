; Supervisor program definition for the FileServer Laravel queue worker.
; Install at /etc/supervisor/conf.d/fileserver-worker.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start fileserver-worker:*
;
; Processes audit-log writes, virus scans, and the scheduled purge/usage
; jobs registered in api/routes/console.php. Pair with the cron entry in
; docs/DEPLOYMENT.md that runs `php artisan schedule:run` every minute —
; that's what actually dispatches the scheduled jobs into this queue.

[program:fileserver-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fileserver/api/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/var/www/fileserver/api
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/fileserver/api/storage/logs/worker.log
stopwaitsecs=3600
